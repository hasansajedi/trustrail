<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" role="img" aria-label="trustrail banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07111f;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0d1f38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#071828;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c8f0;stop-opacity:0.1" />
      <stop offset="30%" style="stop-color:#00c8f0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00c8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c8f0;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="shieldBannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2340;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0d4f0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00c8f0" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="180" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#00c8f0" stroke-width="1">
    <line x1="0" y1="45" x2="720" y2="45"/>
    <line x1="0" y1="90" x2="720" y2="90"/>
    <line x1="0" y1="135" x2="720" y2="135"/>
    <line x1="180" y1="0" x2="180" y2="180"/>
    <line x1="360" y1="0" x2="360" y2="180"/>
    <line x1="540" y1="0" x2="540" y2="180"/>
  </g>

  <!-- Decorative rail lines (left) -->
  <line x1="0" y1="62" x2="85" y2="62" stroke="url(#railGrad)" stroke-width="2.5" opacity="0.3"/>
  <line x1="0" y1="90" x2="85" y2="90" stroke="url(#railGrad)" stroke-width="2.5" opacity="0.3"/>
  <line x1="0" y1="118" x2="85" y2="118" stroke="url(#railGrad)" stroke-width="2.5" opacity="0.3"/>

  <!-- Decorative rail lines (right) -->
  <line x1="635" y1="62" x2="720" y2="62" stroke="url(#railGrad)" stroke-width="2.5" opacity="0.3"/>
  <line x1="635" y1="90" x2="720" y2="90" stroke="url(#railGrad)" stroke-width="2.5" opacity="0.3"/>
  <line x1="635" y1="118" x2="720" y2="118" stroke="url(#railGrad)" stroke-width="2.5" opacity="0.3"/>

  <!-- ── Mini shield icon ── -->
  <!-- Shield body -->
  <path d="M 90,18 L 138,30 L 138,82 Q 138,114 90,132 Q 42,114 42,82 L 42,30 Z"
        fill="url(#shieldBannerGrad)" stroke="#00c8f0" stroke-width="2.2"/>

  <!-- Inner highlight -->
  <path d="M 90,26 L 130,36 L 130,52" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.3"/>

  <!-- Mini rails inside shield -->
  <!-- Posts -->
  <line x1="71" y1="54" x2="71" y2="104" stroke="#1e5f8c" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="52" x2="90" y2="106" stroke="#1e5f8c" stroke-width="2" stroke-linecap="round"/>
  <line x1="109" y1="54" x2="109" y2="104" stroke="#1e5f8c" stroke-width="2" stroke-linecap="round"/>

  <!-- Rails -->
  <rect x="55" y="58" width="70" height="5" rx="2.5" fill="#00c8f0" filter="url(#glow2)" opacity="0.9"/>
  <rect x="52" y="75" width="76" height="5" rx="2.5" fill="#00c8f0" filter="url(#glow2)" opacity="0.9"/>
  <rect x="55" y="92" width="70" height="5" rx="2.5" fill="#00c8f0" filter="url(#glow2)" opacity="0.9"/>

  <!-- Nodes -->
  <circle cx="71" cy="60.5" r="4" fill="#0a1628" stroke="#00c8f0" stroke-width="1.5"/>
  <circle cx="90" cy="60.5" r="4" fill="#00c8f0"/>
  <circle cx="109" cy="60.5" r="4" fill="#0a1628" stroke="#00c8f0" stroke-width="1.5"/>

  <circle cx="71" cy="77.5" r="4" fill="#00c8f0"/>
  <circle cx="90" cy="77.5" r="6" fill="#00e5ff" filter="url(#glow2)"/>
  <circle cx="90" cy="77.5" r="3" fill="#ffffff"/>
  <circle cx="109" cy="77.5" r="4" fill="#00c8f0"/>

  <circle cx="71" cy="94.5" r="4" fill="#0a1628" stroke="#00c8f0" stroke-width="1.5"/>
  <circle cx="90" cy="94.5" r="4" fill="#00c8f0"/>
  <circle cx="109" cy="94.5" r="4" fill="#0a1628" stroke="#00c8f0" stroke-width="1.5"/>

  <!-- Shield label -->
  <text x="90" y="122"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="7.5" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="1.5" opacity="0.8">AEGIS</text>

  <!-- ── Main title text ── -->
  <text x="310" y="85"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="800"
        fill="url(#textGrad)" text-anchor="middle"
        letter-spacing="-1"
        filter="url(#textShadow)">trustrail</text>

  <!-- Accent underline -->
  <rect x="175" y="96" width="270" height="3" rx="1.5" fill="url(#railGrad)" opacity="0.7"/>

  <!-- Tagline -->
  <text x="310" y="126"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="14.5" font-weight="400"
        fill="#7ecfee" text-anchor="middle" letter-spacing="0.5">
    Production-grade guardrails for LLM &amp; AI applications
  </text>

  <!-- OWASP badge pill -->
  <rect x="196" y="144" width="120" height="20" rx="10" fill="#00c8f0" opacity="0.12" stroke="#00c8f0" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="256" y="158"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="9" font-weight="600"
        fill="#00c8f0" text-anchor="middle" letter-spacing="0.8">OWASP LLM Top 10</text>

  <!-- Apache badge pill -->
  <rect x="326" y="144" width="96" height="20" rx="10" fill="#00c8f0" opacity="0.12" stroke="#00c8f0" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="374" y="158"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="9" font-weight="600"
        fill="#00c8f0" text-anchor="middle" letter-spacing="0.8">Apache 2.0</text>

  <!-- Python badge pill -->
  <rect x="432" y="144" width="88" height="20" rx="10" fill="#00c8f0" opacity="0.12" stroke="#00c8f0" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="476" y="158"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="9" font-weight="600"
        fill="#00c8f0" text-anchor="middle" letter-spacing="0.8">Python 3.11+</text>

  <!-- Border glow -->
  <rect width="720" height="180" fill="none" stroke="#00c8f0" stroke-width="1.5" rx="12" opacity="0.25"/>
</svg>
