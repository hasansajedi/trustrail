name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build
      - name: Build
        run: python -m build
      - name: Verify artifact version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found: {wheels}")
          actual = wheels[0].name.removeprefix("aiRail-").split("-", 1)[0]
          if actual != expected:
              raise SystemExit(
                  f"Release tag {expected!r} does not match built version {actual!r}"
              )
          print(f"Verified release version {actual}")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
