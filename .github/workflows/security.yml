name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade "pip>=26.2" "setuptools>=84.1.0" pip-audit
      - name: Install dependencies
        run: pip install -e ".[dev,all]"
      - name: Run audit
        # NLTK is transitive through llama-index-core. PYSEC-2026-3740 has no
        # fixed PyPI release after 3.10.3; trustrail does not call the affected
        # model-artifact file APIs. Remove this exception when upstream ships a fix.
        run: >-
          pip-audit --skip-editable
          --ignore-vuln PYSEC-2026-3740

  security-corpus:
    name: Security Corpus Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run security tests
        run: pytest tests/security/ -v --tb=short
      - name: Enforce adaptive prompt-injection regression gate
        run: >-
          python -m trustrail.testing.red_team
          tests/security_corpus/adaptive_prompt_injection.json
