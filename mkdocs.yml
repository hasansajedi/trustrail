site_name: trustrail
site_description: Production-grade Python guardrails for GenAI and LLM applications
site_url: https://trustrail.readthedocs.io/
repo_url: https://github.com/hasansajedi/trustrail
repo_name: hasansajedi/trustrail
edit_uri: edit/main/docs/
copyright: Copyright &copy; trustrail Contributors

theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Use light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

nav:
  - Home: index.md
  - Get Started:
      - Installation: installation.md
      - Quick start: quickstart.md
      - Core concepts: concepts.md
      - Configuration: configuration.md
      - CLI: cli.md
  - Guides:
      - Protect user input: guides/protect-user-input.md
      - Protect LLM output: guides/protect-llm-output.md
      - Protect RAG pipelines: guides/protect-rag.md
      - Protect agents: guides/protect-agents.md
      - Protect persistent memory: guides/protect-memory.md
      - Adaptive red-team gates: guides/red-team-gates.md
      - Protect tools: guides/protect-tools.md
      - Protect streaming output: guides/protect-streaming.md
      - Rate limiting: guides/rate-limiting.md
      - Streaming internals: streaming.md
      - Custom rules: custom-rules.md
      - Guardrail lifecycle: guardrail-lifecycle.md
      - Risk scoring: risk-scoring.md
      - Observability: observability.md
  - Integrations:
      - External safety providers: integrations/external-safety-providers.md
      - OpenAI: integrations/openai.md
      - FastAPI: integrations/fastapi.md
      - LangChain: integrations/langchain.md
      - LlamaIndex: integrations/llamaindex.md
  - Security:
      - Threat model: security/threat-model.md
      - Prompt injection: security/prompt-injection.md
      - Red-team regression: security/red-team-regression.md
      - Sensitive data: security/sensitive-data.md
      - Output handling: security/output-handling.md
      - RAG security: security/rag-security.md
      - Persistent memory: security/memory-security.md
      - Data and model poisoning: security/data-model-poisoning.md
      - Excessive agency: security/excessive-agency.md
      - System prompt leakage: security/system-prompt-leakage.md
      - Vector and embedding security: security/vector-embedding-security.md
      - Misinformation and overreliance: security/misinformation-overreliance.md
      - Resource consumption: security/resource-consumption.md
      - Supply chain: security/supply-chain.md
      - OWASP mapping: owasp-mapping.md
  - Reference:
      - API overview: api/index.md
      - Guard engine: api/guard.md
      - Models and enums: api/models.md
      - Rules and protocols: api/rules.md
      - Streaming and agents: api/advanced.md
      - Policies: policies.md
      - Architecture: architecture.md
      - Performance: performance.md
      - Migration: migration.md
